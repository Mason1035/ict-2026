# /etc/mosquitto/conf.d/geohazard.conf (Mosquitto 2.0.x)
# 0.0.0.0 includes 127.0.0.1; do not add a second IPv4 listener on port 1883.
# Remove/merge any existing explicit 1883 listener before enabling this snippet.
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/geohazard.passwd
