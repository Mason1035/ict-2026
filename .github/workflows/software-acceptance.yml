name: Software acceptance
on:
  push:
    branches: [main, 张鹏飞]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -e './platform_backend[dev]'
      - name: Full backend suite
        run: python -B -m pytest platform_backend/tests -ra -o addopts= --junitxml=work/ci/backend.xml
      - name: Algorithm software tests
        if: always()
        working-directory: algorithm/B_revised
        run: python -B -m unittest discover -s data_intake -t . -p 'test_*.py'
      - name: Publish failure details for review
        if: always()
        run: python -B scripts/report_junit_ci.py work/ci/backend.xml
      - name: Preserve reproducible environment
        if: always()
        shell: bash
        run: |
          mkdir -p work/ci
          git rev-parse HEAD > work/ci/commit.txt
          python --version > work/ci/python.txt
          python -m pip freeze > work/ci/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.os }}-${{ github.sha }}
          path: work/ci/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: apps/geohazard-demo
        run: npm ci
      - name: Typecheck and build
        working-directory: apps/geohazard-demo
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: apps/geohazard-demo/dist/
